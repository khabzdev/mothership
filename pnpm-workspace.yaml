  "@react-three/postprocessing": ^3.1.3
  "@tailwindcss/vite": ^4.3.3
  "@types/better-sqlite3": ^9.6.0
  "@types/node": ^24
  "@types/three": ^0.186.0
  "@types/ws": ^8.18.2
  "@xterm/addon-fit": ^0.11.0
  "@xterm/addon-serialize": ^0.14.0
  "@xterm/headless": ^6.0.0
  "@xterm/xterm": ^6.0.0
  better-sqlite3: ^13.0.3
  drizzle-kit: ^0.31.11
