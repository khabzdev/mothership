  "@hugeicons/core-free-icons": ^4.3.5
  "@hugeicons/react": ^1.1.10
  "@lydell/node-pty": 1.2.0-beta.15
  "@phosphor-icons/react": ^2.1.10
  "@react-three/drei": ^10.7.9
